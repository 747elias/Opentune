# Builds the desktop app for Windows, macOS and Linux and attaches the installers to a GitHub
# release, next to the Android APKs. It follows each successful Release on main (that workflow
# publishes the release, and a release it makes sends no release event of its own), and can be run
# by hand for a release that's already out: Actions > Desktop release > Run workflow, with its tag.
#
# Each file is named for the release and the system it's for, e.g.
#   OpenTune-v1.0.4-windows-x64-setup.exe   OpenTune-v1.0.4-macos-universal.dmg
#   OpenTune-v1.0.4-linux-x86_64.AppImage   OpenTune-v1.0.4-linux-amd64.deb
# Running again for the same tag replaces them.
name: Desktop release

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to attach the desktop downloads to, e.g. v1.0.4
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  # Which release, and the commit it was built from.
  release:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      ref: ${{ steps.find.outputs.ref }}
      macos: ${{ steps.find.outputs.macos }}
      windows_linux: ${{ steps.find.outputs.windows_linux }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.tag }}
          fetch-depth: 0
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-v$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::No release $tag to attach desktop downloads to."
            exit 0
          fi
          git fetch --tags --force --quiet
          # Built from the commit the release's tag points at, so the desktop app is that version's.
          ref="$(git rev-list -n 1 "$tag")"
          macos=true
          windows_linux=true
          if [ -z "$INPUT_TAG" ]; then
            # A subsequent push can fill in a missing platform without replacing the others.
            assets="$(gh release view "$tag" --json assets -q '.assets[].name')"
            if grep -Fxq -- "OpenTune-$tag-macos-universal.dmg" <<< "$assets"; then
              macos=false
            fi
            if grep -Fxq -- "OpenTune-$tag-windows-x64-setup.exe" <<< "$assets" &&
               grep -Fxq -- "OpenTune-$tag-linux-amd64.deb" <<< "$assets"; then
              windows_linux=false
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          echo "windows_linux=$windows_linux" >> "$GITHUB_OUTPUT"
          echo "Desktop downloads for $tag from ${ref:0:7}"

  desktop:
    needs: release
    if: needs.release.outputs.windows_linux == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tasks: :desktop:packageDeb :desktop:packageRpm
          - os: windows-latest
            tasks: :desktop:packageMsi :desktop:packageExe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The build includes the Android modules, which need the SDK to configure.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v4
      - name: RPM tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Installers
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID || secrets.DISCORD_APP_ID }}
        run: ./gradlew --no-daemon ${{ matrix.tasks }} :desktop:createDistributable
      # The packaged app on its own trimmed runtime: FFmpeg, GraalJS and SQLite must load there too.
      - name: Packaged app self-check
        if: runner.os != 'Windows'
        shell: bash
        run: desktop/build/compose/binaries/main/app/OpenTune/bin/OpenTune --self-check
      - name: Name the files for the release
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/desktop" && mkdir -p "$out"
          bin=desktop/build/compose/binaries/main
          case "$RUNNER_OS" in
            Linux)
              cp "$bin"/deb/*.deb "$out/OpenTune-$TAG-linux-amd64.deb"
              cp "$bin"/rpm/*.rpm "$out/OpenTune-$TAG-linux-x86_64.rpm"
              desktop/packaging/appimage.sh "$bin/app/OpenTune" "$out/OpenTune-$TAG-linux-x86_64.AppImage"
              ;;
            Windows)
              cp "$bin"/msi/*.msi "$out/OpenTune-$TAG-windows-x64.msi"
              cp "$bin"/exe/*.exe "$out/OpenTune-$TAG-windows-x64-setup.exe"
              pwsh -NoProfile -Command "Compress-Archive -Path '$bin/app/OpenTune' -DestinationPath '$out/OpenTune-$TAG-windows-x64-portable.zip'"
              ;;
          esac
          ls -la "$out"
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/desktop/* --clobber --repo "${{ github.repository }}"

  macos:
    needs: release
    if: needs.release.outputs.macos == 'true'
    uses: ./.github/workflows/desktop-macos.yml
    with:
      ref: ${{ needs.release.outputs.ref }}
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
      DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

  publish-macos:
    needs: [release, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-universal
          path: ${{ runner.temp }}/macos-dmg
      - name: Attach the verified DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/macos-dmg/OpenTune-$TAG-macos-universal.dmg" --clobber --repo "$GITHUB_REPOSITORY"
