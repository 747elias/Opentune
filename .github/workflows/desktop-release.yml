name: Attach verified OpenTune Arch package

on:
  workflow_dispatch:

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: 747elias/Opentune
      TAG: arch-v1.1.0
      RELEASE_SHA: a592cad959e657fbfed874df63fe9e765d2716a2
      BUILD_RUN: '44491699501'
      PACKAGE_NAME: opentune-1.1.0-1-x86_64.pkg.tar.zst
    steps:
      - name: Check the tested commit and draft release
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$BUILD_RUN" --json headSha,jobs | jq -e --arg sha "$RELEASE_SHA" '
            .headSha == $sha and any(.jobs[]; any(.steps[]; .name == "Upload Arch Linux package" and .conclusion == "success"))'
          gh release view "$TAG" --json isDraft,targetCommitish | jq -e --arg sha "$RELEASE_SHA" '
            .isDraft and .targetCommitish == $sha'
          digest=$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/artifacts" | jq -er --arg name "$PACKAGE_NAME" '
            [.artifacts[] | select(.name == $name and .expired == false)] | if length == 1 then .[0].digest else error("expected one package") end')
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "PACKAGE_DIGEST=${digest#sha256:}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ runner.temp }}/arch-delivery
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
      - name: Verify and upload the Arch package
        shell: bash
        working-directory: ${{ runner.temp }}/arch-delivery
        run: |
          printf '%s  %s\n' "$PACKAGE_DIGEST" "$PACKAGE_NAME" | sha256sum --check
          gh release upload "$TAG" "$PACKAGE_NAME"
